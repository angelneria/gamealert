name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - run: npm ci
      - run: npm run db:generate
      # Sin esto Prisma no tiene URL y el registro devuelve 500:
      # SQLite local efímero solo para los tests (no se sube a ningún lado)
      - run: npm run db:push
        env:
          DATABASE_URL: "file:./dev.db"
      - run: npm run test
        env:
          DATABASE_URL: "file:./dev.db"
      - run: npm run test:coverage
        env:
          DATABASE_URL: "file:./dev.db"

  build:
    # Sin job de lint: el repo no tiene ESLint configurado (nunca lo tuvo);
    # la puerta real es test (incluye tsc) + build. El deploy lo hace Vercel
    # vía integración Git, no Docker (no hay Dockerfile en el repo).
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
